<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unfiltered Mind</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --charcoal: #3a3a3a;
      --beige: #f8f6f4;
      --accent: #648381;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--beige);
      font-family: 'Inter', sans-serif;
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      min-height: 100vh;
      padding: 60px 20px 40px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p.tagline {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    .form-container {
      max-width: 400px;
      width: 100%;
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      margin-bottom: 40px;
    }

    .form-container h4 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .form-container p {
      font-size: 1rem;
      margin-bottom: 20px;
      color: var(--charcoal);
    }

    form.ml-block-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    form.ml-block-form input[type="email"] {
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
    }

    form.ml-block-form button.primary {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    form.ml-block-form button.primary:hover {
      background-color: #536e6d;
    }

    .ml-form-successContent {
      text-align: center;
    }

    .socials {
      margin-top: 20px;
    }

    .socials a {
      color: var(--charcoal);
      margin: 0 12px;
      text-decoration: none;
      font-size: 0.95rem;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.2rem;
      }

      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Unfiltered Mind</h1>
  <p class="tagline">It's not therapy. But it might get you there.</p>

  <!-- Begin MailerLite Form -->
  <div class="form-container">
    <h4>Join the Waitlist</h4>
    <p>Be the first to know when Unfiltered Mind launches.</p>
    <form class="ml-block-form" action="https://assets.mailerlite.com/jsonp/1496256/forms/153419814196479140/subscribe" method="post" target="_blank">
      <input type="email" name="fields[email]" placeholder="Email" required autocomplete="email" />
      <input type="hidden" name="ml-submit" value="1" />
      <input type="hidden" name="anticsrf" value="true" />
      <button type="submit" class="primary">Join the Waitlist</button>
    </form>
    <div class="ml-form-successContent" style="display:none;">
      <h4>Thank you!</h4>
      <p>You have successfully joined our subscriber list.</p>
    </div>
  </div>
  <!-- End MailerLite Form -->

  <div class="socials">
    <a href="https://instagram.com/unfilteredmindseries" target="_blank">Instagram</a>
    <a href="https://tiktok.com/@unfilteredmindseries" target="_blank">TikTok</a>
  </div>
</body>
</html>
