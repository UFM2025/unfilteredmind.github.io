<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unfiltered Mind</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --charcoal: #3a3a3a;
      --beige: #f8f6f4;
      --accent: #648381;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--beige);
      font-family: 'Inter', sans-serif;
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      height: 100vh;
      padding: 0 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 600px;
    }

    a.button {
      text-decoration: none;
      background-color: var(--accent);
      color: #fff;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: #536e6d;
    }

    .socials {
      margin-top: 2.5rem;
    }

    .socials a {
      color: var(--charcoal);
      margin: 0 12px;
      text-decoration: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>Unfiltered Mind</h1>
  <p>It's not therapy. But it might get you there.</p>
  <a class="button" href="mailto:hello@unfilteredmind.co.uk">Email Us</a>

  <div class="socials">
    <a href="https://instagram.com/unfilteredmindseries" target="_blank">Instagram</a>
    <a href="https://tiktok.com/@unfilteredmindseries" target="_blank">TikTok</a>
  </div>
</body>
</html>
